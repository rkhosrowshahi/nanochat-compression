# Qwen2.5-0.5B-Instruct, hardware-aware search (scripts/compress_search_hw.py), scenario 1 of 2:
# objectives delta_loss + predicted decode latency; memory is only a constraint (and logged for every
# solution). Genes: bf16 or an int4 group size per role (qkv, o, up, down) and depth band (4 bands),
# lm_head (tied to the embedding), the MLP width kept per band, and how many attention / MLP sublayers
# are removed. Latency: one decode step of 1 sequence at 1024 tokens of context, from kernel times
# measured on this GPU. The same settings as qwen_hw_3obj.yaml, so the fronts compare directly:
#   python -m scripts.compress_run configs/compress/qwen_hw_2obj.yaml
#   python -m scripts.compress_compare --run-dirs compress_runs/qwen_hw_2obj compress_runs/qwen_hw_3obj \
#       --labels "2 objectives" "3 objectives" --x latency --out compress_runs/comparisons/qwen_hw_2obj_vs_3obj/qwen_hw_fronts_latency
model: Qwen/Qwen2.5-0.5B-Instruct
out_dir: compress_runs/qwen_hw_2obj
eval_batch_size: 1

search:
  method: hw
  objectives: [latency]
  pop_size: 40
  n_gen: 12
  seed: 42
  max_delta_loss: 1.0
  memory_budget_mb: 7000   # an 8 GB GPU with room for activations (never binds for this model)
  latency_batch: 1
  latency_context: 1024
  bands: 4

calibration:
  seqs: 8                  # the same batch as the other Qwen runs (shared through the cache)
  seq_len: 2048

test:                      # a quick local check; the server configs use the full test sets
  seq_len: 2048
  wikitext_seqs: 32
  c4_seqs: 32
  max_points: 6

validate:
  points: 6
