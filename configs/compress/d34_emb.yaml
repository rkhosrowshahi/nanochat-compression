# nanochat d34 with everything compressed (2.22B weights, 100%): the 204 transformer matrices plus the
# token embedding and lm_head, which in d34 are two separate matrices (6.4% of the parameters each).
# The d34 counterpart of qwen_emb.yaml; otherwise the same settings as d34.yaml, so the two compare.
# The warm-up runs again: compressing more matrices moves the error-vs-K curve.
#   python -m scripts.compress_run configs/compress/d34_emb.yaml
model: nanochat:base:d34
download: karpathy/nanochat-d34
nanochat_base_dir: ~/.cache/nanochat-d34
out_dir: compress_runs/d34_10_log2_autok_c0.9_prune0.3_calib_fixed_128x2048_maxdelta1.0_inc-embeddings-lm_head
include: [embeddings, lm_head]
eval_batch_size: 2

search:
  pop_size: 100
  n_gen: 10
  seed: 42
  k_space: log2
  auto_k_bounds: true
  c_min: 0.9
  alpha_min: -0.3
  beta_max: 0.3
  max_delta_loss: 1.0

calibration:
  seqs: 128
  seq_len: 2048
  every: 0                # the batch is shared through the cache, no download if a run made it

test:
  seq_len: 2048
  wikitext_seqs: -1
  c4_seqs: 256
